[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "universal-imagegen-agent"
version = "0.1.0"
description = "A provider-configurable image generation skill and CLI for general-purpose AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "SnowSky1" },
]
keywords = ["agents", "image-generation", "openai-compatible", "cli", "skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "openai>=2.15.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
imagegen-agent = "universal_imagegen.cli:main"

[project.urls]
Repository = "https://github.com/SnowSky1/universal-imagegen-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_imagegen"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
